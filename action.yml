name: Develocity Artifact Cache GitHub Action
description: Restore and store Gradle, Maven, npm, pip, and Sonar build dependencies through the Develocity Artifact Cache.
author: Develocity

# Marketplace listing branding. Matches the gradle/actions house style (color:
# gray-dark); a distinct icon (database) avoids confusion with setup-gradle /
# dependency-submission, which use box. icon must be a Feather v4.28.0 icon.
branding:
  icon: database
  color: gray-dark

inputs:
  develocity-url:
    description: Develocity server URL, passed to the AC CLI as --dv-server.
    required: true
  develocity-access-key:
    description: >-
      Develocity access key used to authenticate the AC CLI. Provide the raw
      key value for the develocity-url host — not the host=key form used by the
      sources below. Optional: when unset, it is resolved from the
      DEVELOCITY_ACCESS_KEY environment variable (host=key form), then from
      keys.properties (~/.gradle/develocity or ~/.m2/.develocity) for the
      develocity-url host, matching the CLI's own lookup. The input takes
      precedence over the environment variable and the key file; if none yields
      a key, all cache activity is skipped.
    required: false
  ac-image-names:
    description: >-
      Ordered image names, one per line. The first is the primary — the name the
      cache is stored under and the first that restore tries — and the rest are
      restore-only fallbacks. Defaults to the AC CLI's auto-generated name.
    required: false
  matrix:
    description: >-
      Serialize the job's matrix context with toJSON and pass it here to enable a
      best-effort warning when the build matrix has axes the auto-generated cache
      name does not isolate (anything beyond OS and arch, e.g. a Java or tool
      version), so those matrix jobs would share one cache. Optional; no warning
      is emitted when unset. Isolate a sensitive axis by adding a dedicated
      ac-image-names entry.
    required: false
  cache-read-only:
    description: When true, skip the post-step store call.
    required: false
    default: "false"
  cache-store-on-failure:
    description: >-
      When true, store the cache even if the build failed. Defaults to false: the
      post step stores only when the job succeeds, so a failed build does not
      overwrite the cache. Independent of cache-read-only, which skips the store
      entirely.
    required: false
    default: "false"
  ac-cli-version:
    description: >-
      AC CLI version to download. Defaults to the pinned general-availability
      version resolved from the distribution manifest.
    required: false
  ac-cli-repository:
    description: >-
      JAR download source. Defaults to the public Develocity download URL. Set
      to an internal mirror for air-gapped runners.
    required: false
  ac-cli-repository-header:
    description: >-
      A single "Name: Value" HTTP header sent on the JAR download, for an
      authenticated mirror. Provide this via a GitHub secret to ensure it is masked in logs. Not forwarded to the CLI.
    required: false
  ac-cli-sha256:
    description: >-
      Expected JAR SHA-256. Verifies a pinned version the distribution manifest
      does not list.
    required: false
  additional-cli-args:
    description: >-
      Extra arguments appended to every AC CLI restore and store invocation, one
      argument per line. The flags controlled by the action — --dv-server,
      --dv-edge, --image-name, and --cache-metrics-file — are rejected here.
    required: false

runs:
  using: node24
  main: dist/main/index.js
  post: dist/post/index.js
  # Gate the store on job success. By default the post step stores only when the
  # job succeeded, so a failed build never overwrites the cache. The main step
  # exports DV_AC_STORE_ON_FAILURE from the cache-store-on-failure input to carry
  # the opt-in here, because post-if cannot read an action input directly, only
  # the workflow env context. If the runner ever failed to surface that variable,
  # this degrades to a plain success() — the safe default still holds.
  post-if: success() || env.DV_AC_STORE_ON_FAILURE == 'true'
