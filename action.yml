name: Develocity Artifact Cache GitHub Action
description: Restore and store Gradle, Maven, npm, pip, and Sonar build dependencies through the Develocity Artifact Cache.
author: Develocity

# Marketplace listing branding. Matches the gradle/actions house style (color:
# gray-dark); a distinct icon (database) avoids confusion with setup-gradle /
# dependency-submission, which use box. icon must be a Feather v4.28.0 icon.
branding:
  icon: database
  color: gray-dark

inputs:
  develocity-url:
    description: >-
      Develocity server URL, passed to the AC CLI as --dv-server. Provide exactly
      one of develocity-url or develocity-edge-url — they are mutually exclusive.
    required: false
  develocity-edge-url:
    description: >-
      Develocity Edge URL, passed to the AC CLI as --dv-edge to target an Edge
      directly instead of a server. Provide exactly one of develocity-url or
      develocity-edge-url — they are mutually exclusive. Whichever is set also
      identifies the Develocity host for the access-key lookup and short-lived
      token exchange.
    required: false
  develocity-auth:
    description: >-
      Optional. Set to workload-identity to always authenticate with a GitHub
      OIDC token the action mints, ignoring develocity-access-key even when it
      is set. Leave unset, or set to access-key, to use develocity-access-key
      when it is set and fall back to workload identity when it is unset or
      blank. Any other value fails the step.
    required: false
  develocity-access-key:
    description: >-
      Develocity access key for the chosen endpoint host (whichever of
      develocity-url or develocity-edge-url is set). Provide it in host=key form
      (e.g. "develocity.example.com=<key>" or a ";"-separated
      host1=key1;host2=key2 list), matching the DEVELOCITY_ACCESS_KEY format; a
      bare key value is not accepted. The action uses the entry for that
      endpoint host. This input is the only key source: the action does not read
      the DEVELOCITY_ACCESS_KEY environment variable or keys.properties. The
      action immediately exchanges this long-lived key for a short-lived
      Develocity token, used for its own cache restore/store and, when the AC CLI
      is downloaded via the edge route (see cli-repository), as the bearer
      credential for that download; it does NOT set DEVELOCITY_ACCESS_KEY for
      other steps, so neither the long-lived key nor the token is propagated to
      the rest of the workflow. Steps that publish Build Scans should obtain
      their own token (e.g. via setup-gradle). Ignored when develocity-auth is
      workload-identity. When unset or blank, the action falls back to
      workload identity: it mints a GitHub OIDC token instead,
      which needs the id-token: write permission on the job, a workload identity
      rule on Develocity 2026.3 or later, and develocity-edge-url. If that
      fallback fails, the action warns and skips all cache activity for the job;
      it never fails the build for a missing or unmatched key.
    required: false
  develocity-oidc-audience:
    description: >-
      Audience (aud claim) of the GitHub OIDC token the action mints, when
      develocity-auth is workload-identity or develocity-access-key is not set.
      Must match the audience on the Develocity workload identity rule. Defaults
      to the origin of the chosen endpoint, develocity-edge-url or
      develocity-url (e.g. https://develocity.example.com). Ignored when the
      action authenticates with develocity-access-key.
    required: false
  develocity-token-expiry:
    description: >-
      Lifetime, in hours, of the short-lived Develocity token the action obtains
      from its credential (the access key or the GitHub OIDC token) for its own
      cache restore/store. Defaults to 2. The main and post steps each obtain
      their own token, so it only has to cover one cache operation.
    required: false
    default: "2"
  image-names:
    description: >-
      Ordered image names, one per line. The first is the primary — the name the
      cache is stored under and the first that restore tries — and the rest are
      restore-only fallbacks. Defaults to the AC CLI's auto-generated name.
    required: false
  cache-read-only:
    description: When true, skip the post-step store call.
    required: false
    default: "false"
  cli-version:
    description: >-
      AC CLI version to download. Defaults to the pinned general-availability
      version resolved from the distribution manifest.
    required: false
  cli-repository:
    description: >-
      JAR download source: the directory holding the JARs, which the action
      requests as <cli-repository>/develocity-artifact-cache-cli-<version>.jar,
      the same layout as the Jenkins plugin's cliRepository. Defaults to the
      edge route when an edge-capable Develocity node is detected, otherwise
      the public Develocity download directory. Set to an internal mirror for
      air-gapped runners; an explicit value always wins over the edge route.
      Must be an https URL unless cli-repository-allow-insecure is true.
    required: false
  cli-repository-header:
    description: >-
      A single "Name: Value" HTTP header sent on the JAR download, for an
      authenticated mirror. Provide this via a GitHub secret to ensure it is masked in logs. Not forwarded to the CLI.
      The action sends it only to an explicit cli-repository. When cli-repository is unset,
      the download takes the edge route or the public default location, and
      neither receives the header. The action warns that it dropped the header. It
      validates the value on every route, so a malformed value still fails
      the step. An edge-capable Develocity node authenticates the download with
      its own bearer token instead of the header.
    required: false
  develocity-url-allow-insecure:
    description: >-
      Allow whichever of develocity-url and develocity-edge-url is set to be a
      plain-http URL. Defaults to false: an http endpoint warns and skips all
      cache activity before any credential is sent, because over http the
      access key or OIDC token, and the short-lived token exchanged for it,
      travel in cleartext. Matches the Jenkins plugin's
      develocityUrlAllowInsecure. When the AC CLI also downloads from that
      endpoint's Edge node, cli-repository-allow-insecure is needed too.
    required: false
    default: "false"
  allow-untrusted:
    description: >-
      Accept the Develocity endpoint's TLS certificate without verifying it:
      for the short-lived token exchange, for the AC CLI download from an Edge
      node at that endpoint, and for the AC CLI itself
      (--allow-untrusted-server). A cli-repository mirror, and any redirect
      away from the endpoint, are still verified. Defaults to false; enable
      only for a self-signed or internal certificate you cannot install on the
      runner. Matches the Jenkins plugin's allowUntrusted.
    required: false
    default: "false"
  cli-repository-allow-insecure:
    description: >-
      Allow downloading the AC CLI over plain http: from a cli-repository
      mirror, or from the Edge node at an http develocity-url or
      develocity-edge-url (which also needs develocity-url-allow-insecure).
      Defaults to false, so an http URL is rejected. Only enable for
      trusted internal CI without TLS: over http the download and any
      cli-repository-header credential (or, on the edge route, the bearer
      token) are sent in cleartext, with no server authentication.
    required: false
    default: "false"
  cli-sha256:
    description: >-
      Expected JAR SHA-256. Required when cli-version pins a version the
      distribution manifest does not list: the action never runs an unverified
      JAR, so without it that version is refused and caching is skipped.
    required: false
  additional-cli-args:
    description: >-
      Extra arguments appended to every AC CLI restore and store invocation, one
      argument per line. The action fails the step on a line that names a flag it
      manages: --dv-server, --image-name, --cache-metrics-file, --dv-edge or
      --allow-untrusted-server (set allow-untrusted instead). A line names a flag
      when its first whitespace-delimited token, up to any "=", is that flag. It
      also fails the step on a line that starts with "@", because the CLI expands
      it into arguments the action cannot check. To pass a value that starts with
      "@", attach it to its flag, as in "--flag=@value". The CLI quotes an argument it
      does not recognize in its output, and the action echoes that output when a
      phase fails. So the action registers each value of 8 or more characters
      with core.setSecret, whether or not it is a secret. The runner then shows
      it as *** in the rest of the job log, including later steps. The mask
      cannot be removed. A shorter value stays readable.
    required: false
  job-status:
    description: >-
      Internal — do not set. The job status the post step inspects to decide
      whether to store. Defaults to the job.status context, which the runner
      re-evaluates at the time the post step actually runs, so it reflects the
      final job outcome (a failed build never stores). Overriding this defeats
      that gate.
    required: false
    default: ${{ job.status }}

runs:
  using: node24
  main: dist/main/index.js
  post: dist/post/index.js
  # The post step always runs so it can write the job summary even on a failed
  # build (it is the sole summary writer). It gates the store itself on the
  # job-status input (default: job.status), so a failed build still never stores.
  post-if: always()
