name: Develocity Artifact Cache GitHub Action
description: Restore and store Gradle, Maven, npm, pip, Playwright, and Sonar build dependencies through the Develocity Artifact Cache.
author: Develocity

# Marketplace listing branding. Matches the gradle/actions house style (color:
# gray-dark); a distinct icon (database) avoids confusion with setup-gradle /
# dependency-submission, which use box. icon must be a Feather v4.28.0 icon.
branding:
  icon: database
  color: gray-dark

inputs:
  develocity-url:
    description: Develocity server URL, passed to the AC CLI as --dv-server.
    required: true
  develocity-access-key:
    description: >-
      Develocity access key for the develocity-url host, used to authenticate the
      AC CLI. Provide it in host=key form (e.g. "develocity.example.com=<key>" or
      a ";"-separated host1=key1;host2=key2 list), matching the
      DEVELOCITY_ACCESS_KEY format; a bare key value is not accepted. The action
      uses the entry for the develocity-url host. This input is the only key
      source: the action does not read the DEVELOCITY_ACCESS_KEY environment
      variable or keys.properties. The action immediately exchanges this
      long-lived key for a short-lived Develocity token and uses that token only
      for its own cache restore/store; it does NOT set DEVELOCITY_ACCESS_KEY for
      other steps, so neither the long-lived key nor the token is propagated to
      the rest of the workflow. Steps that publish Build Scans should obtain their
      own token (e.g. via setup-gradle). Required to enable caching, but the action
      never fails the build for a missing or unmatched key — it warns and skips all
      cache activity for the job.
    required: true
  develocity-token-expiry:
    description: >-
      Lifetime, in hours, of the short-lived Develocity token the action obtains
      from develocity-access-key for its own cache restore/store. Defaults to 2.
      Increase it if a build runs long enough that the token could expire before
      the post-step store runs.
    required: false
    default: "2"
  image-names:
    description: >-
      Ordered image names, one per line. The first is the primary — the name the
      cache is stored under and the first that restore tries — and the rest are
      restore-only fallbacks. Defaults to the AC CLI's auto-generated name.
    required: false
  cache-read-only:
    description: When true, skip the post-step store call.
    required: false
    default: "false"
  cli-version:
    description: >-
      AC CLI version to download. Defaults to the pinned general-availability
      version resolved from the distribution manifest.
    required: false
  cli-repository:
    description: >-
      JAR download source. Defaults to the public Develocity download URL. Set
      to an internal mirror for air-gapped runners. Must be an https URL unless
      cli-repository-allow-insecure is true.
    required: false
  cli-repository-header:
    description: >-
      A single "Name: Value" HTTP header sent on the JAR download, for an
      authenticated mirror. Provide this via a GitHub secret to ensure it is masked in logs. Not forwarded to the CLI.
    required: false
  cli-repository-allow-insecure:
    description: >-
      Allow downloading the AC CLI from a plain-http cli-repository. Defaults
      to false, so an http URL is rejected. Only enable for a trusted internal
      or GitHub Enterprise mirror without TLS: over http the download and any
      cli-repository-header credential are sent in cleartext, with no server
      authentication.
    required: false
    default: "false"
  cli-sha256:
    description: >-
      Expected JAR SHA-256. Verifies a pinned version the distribution manifest
      does not list.
    required: false
  additional-cli-args:
    description: >-
      Extra arguments appended to every AC CLI restore and store invocation, one
      argument per line. The flags controlled by the action — --dv-server,
      --dv-edge, --image-name, and --cache-metrics-file — are rejected here.
    required: false

runs:
  using: node24
  main: dist/main/index.js
  post: dist/post/index.js
  # Gate the store on job success: the post step runs only when the job
  # succeeded, so a failed build never overwrites the cache.
  post-if: success()
