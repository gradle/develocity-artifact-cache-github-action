name: Verify provenance

# Runs the default branch's definition: workflow_run and a dispatch from the default branch
# never execute workflow files from the tag under verification. The tag is checked out into
# candidate/ and the DPG public key is read from the default branch, pinned by fingerprint.

on:
  workflow_run:
    workflows: ['Provenance tag pushed']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to verify (for example, v1.2.3 or snapshot)'
        required: true

permissions:
  contents: read

concurrency:
  group: verify-provenance-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: candidate

env:
  DPG_KEY: ${{ github.workspace }}/trusted/.github/keys/dpg-20251201.pem
  DPG_KEY_SHA256: 6bce0a45a2caeef7bd185bcb887a4f469279da97b9254e34a5b8e9e349498041
  BUNDLE_REGISTRY: 544741663861.dkr.ecr.eu-central-1.amazonaws.com

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          sparse-checkout: .github/keys
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.tag }}
          path: candidate
          persist-credentials: false

      - name: Resolve the tag under verification
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          TAG="${INPUT_TAG:-$RUN_TAG}"
          [[ "$TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.-]*|snapshot)$ ]]
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Verify the DPG public key's fingerprint
        run: |
          ACTUAL_KEY_SHA256=$(openssl pkey -pubin -in "$DPG_KEY" -outform DER | openssl dgst -sha256 | sed 's/^.* //')
          [ "$ACTUAL_KEY_SHA256" = "$DPG_KEY_SHA256" ]

      - name: Verify the DSSE envelope signature
        run: |
          PAYLOAD_TYPE=$(jq -r '.payloadType' attestation.dsse.json)
          PAYLOAD_B64=$(jq -r '.payload' attestation.dsse.json)
          SIG_B64=$(jq -r '.signatures[0].sig' attestation.dsse.json)
          case "$PAYLOAD_TYPE" in ''|null) exit 1 ;; esac
          case "$PAYLOAD_B64" in ''|null) exit 1 ;; esac
          case "$SIG_B64" in ''|null) exit 1 ;; esac
          echo -n "$PAYLOAD_B64" | base64 -d > payload.json
          PAYLOAD_LEN=$(wc -c < payload.json | tr -d ' ')
          TYPE_LEN=$(printf '%s' "$PAYLOAD_TYPE" | wc -c | tr -d ' ')
          printf 'DSSEv1 %s %s %s ' "$TYPE_LEN" "$PAYLOAD_TYPE" "$PAYLOAD_LEN" > pae.bin
          cat payload.json >> pae.bin
          echo -n "$SIG_B64" | base64 -d > sig.bin
          openssl pkeyutl -verify -pubin -inkey "$DPG_KEY" -rawin -in pae.bin -sigfile sig.bin

      - name: Verify the signing keyid
        run: |
          ENVELOPE_KEYID=$(jq -r '.signatures[0].keyid' attestation.dsse.json)
          EXPECTED_KEYID=$(echo "$DPG_KEY_SHA256" | cut -c1-6)
          case "$ENVELOPE_KEYID" in ''|null) exit 1 ;; esac
          [ "$EXPECTED_KEYID" = "$ENVELOPE_KEYID" ]

      # The repository is accepted with and without the registry's develocity/ namespace:
      # the publisher omits the namespace from the purl today.
      # A snapshot's OCI tag is snapshot-<first 12 hex of sha256(bundle.tar)>, while its git
      # tag is the moving snapshot tag.
      - name: Verify the subject identity matches this artifact and tag
        run: |
          ACTUAL_PURL=$(jq -r '.subject[0].name' payload.json)
          PURL_NAME=$(echo "$ACTUAL_PURL" | sed -n 's/^pkg:oci\/\([^@]*\)@.*/\1/p')
          REPO_URL=$(echo "$ACTUAL_PURL" | sed -n 's/.*[?&]repository_url=\([^&]*\).*/\1/p')
          TAG_QUALIFIER=$(echo "$ACTUAL_PURL" | sed -n 's/.*[?&]tag=\([^&]*\).*/\1/p')
          [ -n "$TAG" ]
          [ -n "$PURL_NAME" ]
          [ -n "$REPO_URL" ]
          [ -n "$TAG_QUALIFIER" ]
          [ "$PURL_NAME" = "artifact-cache-action-bundle" ]
          case "$REPO_URL" in
            "$BUNDLE_REGISTRY%2Fartifact-cache-action-bundle"|"$BUNDLE_REGISTRY%2Fdevelocity%2Fartifact-cache-action-bundle") ;;
            *) exit 1 ;;
          esac
          if [ "$TAG" = "snapshot" ]; then
            BUNDLE_SHA256=$(sha256sum bundle.tar | cut -d' ' -f1)
            [ "$TAG_QUALIFIER" = "snapshot-${BUNDLE_SHA256:0:12}" ]
          else
            [ "$TAG_QUALIFIER" = "$TAG" ]
          fi

      - name: Verify envelope subject digest equals sha256(manifest JSON)
        run: |
          SUBJECT_DIGEST=$(jq -r '.subject[0].digest.sha256' payload.json)
          case "$SUBJECT_DIGEST" in ''|null) exit 1 ;; esac
          sha256sum --check <(echo "$SUBJECT_DIGEST  oci-manifest.json")

      - name: Verify manifest layers[0].digest equals sha256(bundle.tar)
        run: |
          LAYER_DIGEST=$(jq -r '.layers[0].digest | sub("^sha256:";"")' oci-manifest.json)
          case "$LAYER_DIGEST" in ''|null) exit 1 ;; esac
          sha256sum --check <(echo "$LAYER_DIGEST  bundle.tar")

      - name: Verify the action files equal bundle.tar's contents
        run: |
          BUNDLE_DIR="$RUNNER_TEMP/bundle"
          mkdir -p "$BUNDLE_DIR"
          tar -xf bundle.tar -C "$BUNDLE_DIR"
          [ -f "$BUNDLE_DIR/action.yml" ]
          [ -d "$BUNDLE_DIR/dist" ]
          [ -z "$(find "$BUNDLE_DIR" ! -type f ! -type d)" ]
          cmp -- "$BUNDLE_DIR/action.yml" action.yml
          (cd "$BUNDLE_DIR" && find . -type f -print0) |
            while IFS= read -r -d '' f; do cmp -- "$BUNDLE_DIR/$f" "$f"; done
          diff -r "$BUNDLE_DIR/dist" dist
